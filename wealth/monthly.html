<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>月结录入 · 财富</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#f2f2f7;color:#1d1d1f;padding:14px 12px 90px}
h1{font-size:19px;margin:4px 0 2px}
.sub{color:#86868b;font-size:12.5px;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px;color:#6e6e73;font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid #f0f0f2}
.row:last-child{border-bottom:0}
.row label{flex:1;min-width:0;font-size:14px}
.row input{width:110px;text-align:right;border:1px solid #e5e5ea;border-radius:9px;padding:7px 9px;font-size:15px;background:#fbfbfd}
.row input:focus{outline:none;border-color:#0071e3}
.res{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
.res .big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.res .line{display:flex;justify-content:space-between;font-size:13.5px;color:#3a3a3c;padding:3px 0}
.res .line b{font-weight:600}
.dir{font-size:12.5px;color:#86868b;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:.5px solid #e5e5ea}
button{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600}
.primary{background:#0071e3;color:#fff}
.ghost{background:#f2f2f7;color:#1d1d1f}
#toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);background:rgba(29,29,31,.92);color:#fff;padding:9px 14px;border-radius:11px;font-size:13px;opacity:0;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<h1>月结录入</h1>
<div class="sub">输入各账户当前余额 → 自动算六类、净资产、环比；保存后可导出给我更新面板</div>

<div class="card"><h2>家荣 · 银行/理财</h2><div id="jr"></div></div>
<div class="card"><h2>家荣 · 证券</h2><div id="zq"></div></div>
<div class="card"><h2>静虹 · 账户</h2><div id="jh"></div></div>
<div class="card"><h2>其他</h2><div id="qt"></div></div>
<div class="card"><h2>负债</h2><div id="fz"></div></div>

<div class="res">
  <div class="line"><span>零钱（活期＋备用现金）</span><b id="r-pocket">0</b></div>
  <div class="line"><span>货币基金</span><b id="r-mf">0</b></div>
  <div class="line"><span>固收类</span><b id="r-fixed">0</b></div>
  <div class="line"><span>权益类</span><b id="r-eq">0</b></div>
  <div class="line"><span>养老金</span><b id="r-pen">0</b></div>
  <div class="line"><span>另类保障（实物金）</span><b id="r-alt">0</b></div>
  <div class="line" style="border-top:.5px solid #eee;margin-top:6px;padding-top:8px"><span>六类合计</span><b id="r-six">0</b></div>
  <div class="line"><span>负债</span><b id="r-liab">0</b></div>
  <div class="big" style="margin-top:8px" id="r-net">净资产 0</div>
  <div class="dir" id="r-delta"></div>
</div>

<div class="bar">
  <button class="ghost" onclick="exportJSON()">导出</button>
  <button class="primary" onclick="save()">保存本月</button>
</div>
<div id="toast"></div>

<script>
const F = {
  jr: [["中行活期","c_boc"],["铁路E卡通","c_etc"],["保险柜现金","c_safe"],["招行活钱","c_cmb"],["月月宝","c_mm"],["黄金账户","c_gold"]],
  zq: [["300增强·市值","e_300"],["工行·市值","e_icbc"],["证券可用现金","e_cash"]],
  jh: [["静虹活期合计","j_cash"],["静虹货基/理财","j_mf"],["静虹固收理财","j_fixed"],["静虹证券持仓","j_eq"]],
  qt: [["个人养老金","pen"],["实物金（估值）","alt"]],
  fz: [["信用卡剩余应还","debt"]]
};
const st = {};
for (const [g, rows] of Object.entries(F)) {
  const el = document.getElementById(g);
  el.innerHTML = rows.map(([label,k]) =>
    `<div class="row"><label>${label}</label><input id="${k}" inputmode="decimal" placeholder="0" oninput="calc()"></div>`
  ).join('');
}
function v(k){ const x=parseFloat(document.getElementById(k).value); return isNaN(x)?0:x; }
function fmt(n){ return n.toLocaleString('zh-CN',{maximumFractionDigits:2}); }
function calc(){
  const pocket = v('c_boc')+v('c_etc')+v('c_safe')+v('j_cash');
  const mf = v('c_cmb')+v('c_mm')+v('j_mf');
  const fixed = v('j_fixed');
  const eq = v('e_300')+v('e_icbc')+v('e_cash')+v('j_eq');
  const pen = v('pen'), alt = v('alt')+v('c_gold'), debt = v('debt');
  const six = pocket+mf+fixed+eq+pen+alt, net = six-debt;
  document.getElementById('r-pocket').textContent = fmt(pocket);
  document.getElementById('r-mf').textContent = fmt(mf);
  document.getElementById('r-fixed').textContent = fmt(fixed);
  document.getElementById('r-eq').textContent = fmt(eq);
  document.getElementById('r-pen').textContent = fmt(pen);
  document.getElementById('r-alt').textContent = fmt(alt);
  document.getElementById('r-six').textContent = fmt(six);
  document.getElementById('r-liab').textContent = fmt(debt);
  document.getElementById('r-net').textContent = '净资产 ' + fmt(net);
  const hist = load();
  const prev = hist[hist.length-1];
  document.getElementById('r-delta').textContent = prev
    ? `环比 ${prev.date}：${(net-prev.net>=0?'+':'')}${fmt(net-prev.net)}`
    : '第一次录入，暂无环比';
  return {pocket,mf,fixed,eq,pen,alt,six,debt,net};
}
function load(){ try { return JSON.parse(localStorage.getItem('wealth_snap')||'[]'); } catch(e){ return []; } }
function save(){
  const r = calc(), hist = load();
  const d = new Date();
  const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const data = {}; for (const k of Object.keys(v ? {} : {})) {}
  document.querySelectorAll('input').forEach(i => data[i.id] = parseFloat(i.value)||0);
  hist.push({date, ...r, raw:data});
  localStorage.setItem('wealth_snap', JSON.stringify(hist));
  toast('已保存 ' + date);
  calc();
}
function exportJSON(){
  const r = calc(), hist = load();
  const d = new Date();
  const out = {导出时间: d.toISOString(), 本期: r, 历史: hist};
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'wealth-monthly.json'; a.click();
  toast('已导出，发给我即可');
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2000); }
calc();
</script>
</body>
</html>
