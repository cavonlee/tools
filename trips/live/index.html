/* ═══════════════════════════════════════════

:root {

  options: { position: 'bottomright' },

    btn.innerHTML = '📍';
    btn.title = '我的位置';
    L.DomEvent.disableClickPropagation(btn);
    btn.addEventListener('click', () => {
      btn.classList.add('active');
      map.locate({ setView: true, maxZoom: 15 });
    });
    this._btn = btn;
    return btn;
  }
});

});

}
function closeDds() { document.querySelectorAll('.dd.open').forEach(e => e.classList.remove('open')); }
function reRenderDay(dayIdx) {

function pickOpt(dayIdx, li, oi) {

/* 搜索添加地点（用高德 JS API PlaceSearch；没加载成功就退回高德搜索页）*/
function ddAddSearch(dayIdx, li) {
  const kw = prompt('搜索地点（如：佛冈 农家菜）');
  if (!kw) return;
  const day = DAYS.find(d => d.id === dayIdx);
  const loc0 = day && day.locations[li];
  if (!loc0) return;
  const push = (list) => {
    loc0.options = loc0.options || [{ name: loc0.name, lat: loc0.lat, lng: loc0.lng, desc: loc0.desc || '' }];
    list.forEach(p => loc0.options.push(p));
    CH[chKey(dayIdx, li)] = loc0.options.length - list.length;   // 默认选中第一个搜索结果
    reRenderDay(dayIdx);
    const ddp = document.getElementById('dd-' + dayIdx + '-' + li);
    if (ddp) ddp.parentElement.classList.add('open');
  };
  if (window.AMap && AMap.PlaceSearch) {
    const ps = new AMap.PlaceSearch({ pageSize: 5, citylimit: false });
    ps.search(kw, (status, result) => {
      if (status === 'complete' && result.poiList && result.poiList.pois.length) {
        push(result.poiList.pois.slice(0, 5).map(p => ({
          name: p.name, lat: p.location.lat, lng: p.location.lng,
          desc: (p.address || '') + (p.tel ? ' · ' + p.tel : '')
        })));
      } else {
        alert('没搜到，换个词试试');
      }
    });
  } else {
    window.open('https://uri.amap.com/search?keyword=' + encodeURIComponent(kw), '_blank');
  }
}
let curDayMarkers = [];

function flashCard(dayIdx, name) {

}

function clearMap() { markers.forEach(m=>map.removeLayer(m)); polylines.forEach(p=>map.removeLayer(p)); markers=[]; polylines=[]; }

function showDay(idx) {
  clearMap();
  if (idx === 0) {
    const pts = [];
    DAYS.forEach(d => d.locations.forEach(l => { if(l.lat) pts.push([l.lat,l.lng]); }));
    if(pts.length) map.fitBounds(pts, {padding:[30,30]});
    DAYS.slice(1).forEach(d => {
      d.locations.filter(l=>l.time!=='—').forEach(l => {
        const m = L.circleMarker([l.lat,l.lng], { radius:4, fillColor:d.color, color:'#fff', weight:1.5, fillOpacity:.9 }).addTo(map).bindPopup(`<b>${l.name}</b><br><span style="color:#86868b">${d.label}</span>`);
        markers.push(m);
      });
    });
    return;
  }
  const day = DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords = [];
  curDayMarkers = [];
  day.locations.forEach((l0, li) => {
    const l = chosen(l0, idx, li);
    if(!l.lat) return;
    const m = L.marker([l.lat,l.lng], { icon: icon(day.color, l.type) }).addTo(map);
    m.__loc = l; m.__idx = li;
    m.on('click', () => { highlightMarker(li); flashCard(idx, l0.name); });
    const gmapQ = l.gmap||encodeURIComponent(l.name+' Tokyo');
    m.bindPopup(`<b>${l.name}</b>${l.time!=='—'?'<br><span style="color:#86868b">'+l.time+'</span>':''}<br>${l.desc}${l.budget?'<br><span style="color:#ff9500">'+l.budget+'</span>':''}<br><a href="#" onclick="event.preventDefault();openAS('${l.name.replace(/'/g,"\\'")}',${l.lat},${l.lng},'${gmapQ}')">📍 导航</a>${l.xhs?' · <a href="'+l.xhs+'" target="_blank">📕 小红书</a>':''}`);
    markers.push(m); curDayMarkers[li] = m;
    if(l.time!=='—') coords.push([l.lat,l.lng]);
  });
  if(coords.length>1) { const pl = L.polyline(coords, { color:day.color, weight:2.5, opacity:.5, dashArray:'6,5' }).addTo(map); polylines.push(pl); }
  if(coords.length) map.fitBounds(coords, { padding:[40,40], maxZoom:14 });
}

function payChips(pay) {
  if(!pay) return '';
  let h = '<div class="pays">';
  const m = { cash:'💴', card:'💳', suica:'Suica', paypay:'PayPay', alipay:'支付宝', wechat:'微信' };
  for(const [k,label] of Object.entries(m)) {
    if(pay[k]!==undefined) { const c = pay[k]===1?'ok':pay[k]===0.5?'idk':'no'; h += `<span class="pay ${c}">${label}</span>`; }
  }
  return h+'</div>';
}

  const ICON_XHS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5A2.5 2.5 0 0 1 17.5 21H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h8M8 12h8"/></svg>';
  let lnk = `<button class="btn nav" onclick="openNavSheet('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng})">${ICON_NAV}<span>导航</span></button>`;

let _leg = null, legLayer = null;
function legCoords(dayIdx, li) {
  const day = DAYS.find(d => d.id === dayIdx);
  if (!day || li < 1) return null;
  const a0 = day.locations[li - 1], b0 = day.locations[li];
  const a = chosen(a0, dayIdx, li - 1), b = chosen(b0, dayIdx, li);
  return { from: a0.name, to: b0.name, a: [a.lat, a.lng], b: [b.lat, b.lng] };
}
function clearLegLayer() { if (legLayer) { map.removeLayer(legLayer); legLayer = null; } }
function openLegSheet(dayIdx, li) {
  _leg = [dayIdx, li];
  const c = legCoords(dayIdx, li);
  if (!c) return;
  document.getElementById('legFrom').textContent = c.from;
  document.getElementById('legTo').textContent = c.to;
  document.getElementById('legSheet').classList.add('show');
  renderLegModes();
  drawLegRoute();
}
function closeLegSheet() {
  document.getElementById('legSheet').classList.remove('show');
  clearLegLayer();
}
function currentLegMode() {
  const [d, li] = _leg || [];
  return legMode[d + ':' + li] || defMode();
}
function renderLegModes() {
  const cur = currentLegMode();
  document.getElementById('legModes').innerHTML = ['drive','taxi','walk'].map(m =>
    `<button class="mode-opt${m===cur?' on':''}" data-m="${m}" onclick="setLegMode('${m}')">${MODES[m].label}</button>`).join('');
}
function setLegMode(m) {
  if (!_leg) return;
  legMode[_leg[0] + ':' + _leg[1]] = m;
  renderLegModes();
  drawLegRoute();
  reRenderDay(cur);
  document.getElementById('legSheet').classList.add('show');
}
function drawLegRoute() {
  const [dayIdx, li] = _leg || [];
  const c = legCoords(dayIdx, li);
  if (!c) return;
  const mode = currentLegMode();
  const key = dayIdx + ':' + li;
  const d = LEGS[key] || {};
  // 先用离线数据填概要
  const stat = (mode === 'walk') ? d.walk : d.drive;
  fillLegSummary(stat);
  clearLegLayer();
  const A = [c.a[0], c.a[1]], B = [c.b[0], c.b[1]];
  const drawLine = (pts, dotted) => {
    legLayer = L.polyline(pts, { color: '#0071e3', weight: 5, opacity: .85, lineJoin: 'round', dashArray: dotted ? '8,8' : null }).addTo(map);
    legLayer.bringToFront();
    map.fitBounds(legLayer.getBounds(), { padding: [40, 40], maxZoom: 14 });
  };
  // ① 先用离线真实道路折线（高德 Web服务预取，含 driving / walking）
  const pathSet = (typeof LEGPATHS !== 'undefined' && LEGPATHS[key]) ? LEGPATHS[key] : null;
  const cached = pathSet ? (mode === 'walk' ? pathSet.walk : pathSet.drive) : null;
  if (cached && cached.length > 1) {
    drawLine(cached, false);
    document.getElementById('legHint').textContent = (mode === 'walk' ? '步行' : '驾车') + '路线（按默认选项的坐标预先规划）';
    return;
  }
  // ② 没有离线折线时，尝试实时高德 JS API
  if (window.AMap) {
    const engine = (mode === 'walk') ? (AMap.Walking ? new AMap.Walking({}) : null)
                                     : (AMap.Driving ? new AMap.Driving({}) : null);
    const done = (status, result) => {
      if (status === 'complete' && result.routes && result.routes[0]) {
        const r = result.routes[0];
        const pts = [];
        (r.steps || []).forEach(st => (st.path || []).forEach(q => pts.push([q.lat, q.lng])));
        if (pts.length > 1) drawLine(pts, false);
        document.getElementById('legHint').textContent = '路线来自高德实时规划';
      } else {
        drawLine([A, B], true);
        document.getElementById('legHint').textContent = '这一段没有该方式的离线路线，画示意直线';
      }
    };
    if (engine) {
      try { engine.search(new AMap.LngLat(c.a[1], c.a[0]), new AMap.LngLat(c.b[1], c.b[0]), done); return; }
      catch (e) {}
    }
  }
  // ③ 兜底：示意直线
  drawLine([A, B], true);
  document.getElementById('legHint').textContent = '暂无该段的离线路线数据，先画示意直线';
}
function fillLegSummary(stat) {
  if (!stat || stat[0] === null) { document.getElementById('legKm').textContent = '—'; document.getElementById('legMin').textContent = ''; return; }
  const km = stat[0], min = stat[1];
  document.getElementById('legKm').textContent = km + ' km';
  document.getElementById('legMin').textContent = min >= 60 ? `${Math.floor(min/60)} 小时${min%60?(' '+min%60+' 分'):''}` : `${min} 分钟`;
}
function cardTap(ev, dayIdx, li, uid) {
  if (ev.target.closest('.btn,.links,.dd')) return;     // 按钮/下拉不触发
  const el = document.getElementById(uid);
  if (el) el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  focusLoc(dayIdx, li);
}
function legInfo(dayIdx, li) {
  const key = dayIdx + ':' + li;
  const d = LEGS[key];
  if (!d) return '';
  let m = legMode[key] || defMode();
  let data = (m === 'walk') ? d.walk : d.drive;
  if (!data || data[0] === null) { data = d.drive; m = 'drive'; }   // 没有该方式数据时退回自驾
  if (!data || data[0] === null) return '';
  const km = data[0], min = data[1];
  if (km === 0) return '';
  const timeTxt = min >= 60 ? `${Math.floor(min/60)} 小时${min%60?(' '+min%60+' 分'):''}` : `${min} 分钟`;
  return `<div class="leg" onclick="event.stopPropagation()">
    <span class="leg-line"></span>
    <button class="leg-pill" onclick="openLegSheet(${dayIdx},${li})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${MODES[m].icon}</svg>
      <span>${MODES[m].label} ${km}km · ${timeTxt}</span>
    </button>
    <span class="leg-line"></span>
  </div>`;
}
function cycleMode(dayIdx, li) {
  const order = ['drive','taxi','walk'];
  const key = dayIdx + ':' + li;
  const cur = legMode[key] || defMode();
  legMode[key] = order[(order.indexOf(cur) + 1) % order.length];
  reRenderDay(dayIdx);
}
function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  if(main.length) { h += '<div class="section-head">行程</div><div class="timeline">'; main.forEach((l,i) => { const li = d.locations.indexOf(l); if (i>0) h += legInfo(idx, li); h += locCard(l, idx, li); }); h += '</div>'; }
  if(alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach((l,i) => { h += locCard(l, idx, d.locations.indexOf(l)); }); h += '</div>'; }
  return h;
}

  document.getElementById('navSheet').classList.add('show');
}
function closeNavSheet() { document.getElementById('navSheet').classList.remove('show'); }
/* 调起某个地图 App；失败/没装 → 回退网页 */
function openMapApp(kind) {
  if (!_nav) return;
  const { name, lat, lng } = _nav;
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isHarmony = /OpenHarmony|HarmonyOS|ArkWeb/i.test(ua);
  const isAndroid = /Android/i.test(ua) || isHarmony;
  const N = encodeURIComponent(name);
  let url = '';
  if (kind === 'system') {
    url = isIOS ? `maps://?q=${lat},${lng}&name=${name}` : `geo:${lat},${lng}?q=${lat},${lng}(${name})`;
  } else if (kind === 'amap') {
    url = isIOS ? `iosamap://path?sourceApplication=pudding&dlat=${lat}&dlon=${lng}&dname=${N}&dev=0&t=0`
                : `amapuri://route/plan/?sourceApplication=pudding&dlat=${lat}&dlon=${lng}&dname=${N}&dev=0&t=0`;
  } else if (kind === 'tencent') {
    url = `qqmap://map/routeplan?type=drive&tocoord=${lat},${lng}&to=${N}&policy=0&referer=pudding`;
  } else if (kind === 'baidu') {
    url = `baidumap://map/direction?destination=latlng:${lat},${lng}|name:${N}&coord_type=gcj02&mode=driving`;
  }
  closeNavSheet();
  let left = false;
  const onHide = () => { if (document.visibilityState === 'hidden') left = true; };
  document.addEventListener('visibilitychange', onHide);
  // 用隐藏 iframe 调 scheme：没装 App 也不会把当前页面顶掉（Chrome 里 location.href 会变 chrome-error）
  try {
    const f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = url;
    document.body.appendChild(f);
    setTimeout(() => { try { f.remove(); } catch (e) {} }, 1500);
  } catch (e) {}
  // ⛔ 不跳网页：1.4s 后还在本页 → 只提示，不打开浏览器
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if (!left && document.visibilityState === 'visible') {
      showToast('没打开地图 App，可能没安装，或被浏览器拦了');
    }
  }, 1400);
}
/* 若系统没拉起任何导航 App（页面还可见），退回应用内选择器兜底 */
function navGuard(name, lat, lng) {
  setTimeout(() => {
    if (document.visibilityState === 'visible') openAS(name, lat, lng);
  }, 1600);
}

function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name + ' Tokyo');
  const encName = encodeURIComponent(name);
  const safeName = name.replace(/'/g,"\\'");
  // WebView 内 maps:// 通常被拦截，改用 https Apple Maps URL —— iOS 系统会自动拉起 Apple Maps
  const appleUrl = IN_APP_WEBVIEW
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('as-opts').innerHTML =
    `<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button>` +
    `<button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button>` +
    `<button class="as-item" onclick="openAmap('${safeName}',${lat},${lng});closeAS()">🧭 高德地图 App</button>`;
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }
</script>
