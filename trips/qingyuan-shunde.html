/* ═══════════════════════════════════════════

:root {

@keyframes loc-pulse {

/* ── Tabs ── */
.tabs {

}
.tabs::-webkit-scrollbar { display: none; }
.tab {

  background: var(--bg-grouped); color: var(--text-secondary);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all .25s ease;
  white-space: nowrap; letter-spacing: -0.01em;
}
.tab:active { transform: scale(.96); }
.tab.active { background: var(--accent); color: #fff; }

/* ── Main content ── */
.content { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(84px + var(--safe-bottom)); }

/* ── Overview ── */
.hero { text-align: center; padding: 28px 20px 20px; }
.hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }
.hero .subtitle { font-size: 17px; color: var(--text-secondary); margin-top: 6px; font-weight: 400; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.info-card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
.info-card .label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 6px; }
.info-card .value { font-size: 15px; font-weight: 600; line-height: 1.4; }

/* ── Section headers ── */
.section-head { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; padding: 20px 0 8px; }

/* ── Day header ── */
.day-head { padding: 20px 0 12px; }
.day-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.day-head p { font-size: 15px; color: var(--text-secondary); margin-top: 2px; }

/* ── Route bar ── */
.route-bar { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); font-size: 13px; color: var(--text-secondary); line-height: 1.7; white-space: pre-line; }
.route-bar strong { color: var(--text-primary); }

/* ── Timeline ── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 20px; bottom: 20px; width: 1.5px; background: var(--separator); }
.tl-item { position: relative; margin-bottom: 10px; }
.tl-dot { position: absolute; left: -20px; top: 18px; width: 10px; height: 10px; border-radius: 50%; z-index: 1; box-shadow: 0 0 0 3px var(--bg-secondary); }
.tl-dot.food    { background: var(--tint-red); }
.tl-dot.spot    { background: var(--tint-blue); }
.tl-dot.hotel   { background: var(--tint-orange); }
.tl-dot.drink   { background: var(--tint-purple); }
.tl-dot.transport { background: var(--text-tertiary); }

/* ── Card ── */
.card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: box-shadow .25s ease; cursor: pointer; }
.card:active { box-shadow: var(--shadow-md); }
.card .time { font-size: 12px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .01em; }
.card .name { font-size: 17px; font-weight: 600; margin: 2px 0 4px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
.card .desc { font-size: 14px; color: var(--text-secondary); line-height: 1.45; }

.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.badge.food   { background: rgba(255,59,48,.1);  color: var(--tint-red); }
.badge.spot   { background: rgba(0,122,255,.1);  color: var(--tint-blue); }
.badge.drink  { background: rgba(175,82,222,.1); color: var(--tint-purple); }

/* Budget */
.budget { display: inline-block; margin-top: 6px; padding: 3px 10px; background: var(--bg-grouped); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); font-weight: 500; }

/* Payment */
.pays { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.pay { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
.pay.ok  { background: rgba(52,199,89,.1);  color: var(--tint-green); }
.pay.no  { background: rgba(255,59,48,.08); color: var(--tint-red); }
.pay.idk { background: rgba(255,149,0,.1);  color: var(--tint-orange); }

.tabs-row { position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
  display: flex; align-items: center; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--separator); }
.tabs-row .tabs { flex:1; }

/* Links row */
.card { transition: background .14s ease, transform .14s ease; }
.card:active { background: var(--bg-tertiary); transform: scale(.995); }
.row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row-top .time { margin: 0; flex: 0 0 auto; }
.row-top .dd { margin: 0; flex: 1 1 auto; min-width: 0; }
.row-top .dd-btn { padding: 6px 10px; font-size: 13px; background: var(--bg-grouped); }
.row-main { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
.col-left { flex: 1; min-width: 0; }
.row-note { margin-top: 10px; padding-top: 8px; border-top: .5px solid #e8e8ed; font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; }
.row-note > div + div { margin-top: 2px; }

/* 卡片左右结构：左内容 / 右按钮（长条，SVG 图标 + 文字） */
.card-main { display: flex; gap: 10px; align-items: flex-start; }
.card-body { flex: 1; min-width: 0; }
.links { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; align-items: stretch; margin-top: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 96px; padding: 9px 12px; border-radius: 10px;
  font-size: 13px; font-weight: 600; border: none; cursor: pointer;
  text-decoration: none !important; transition: filter .2s; white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; flex: 0 0 15px; }
.btn:active { filter: brightness(.9); }
.btn.nav    { background: var(--accent); color: #fff; }
.btn.xhs    { background: #ff2442; color: #fff; }
.btn.dp     { background: #ffa700; color: #fff; }
.btn.rsv    { background: var(--tint-green); color: #fff; }

/* Action Sheet */
.as-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.35); backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.as-overlay.show { opacity: 1; pointer-events: auto; }
.as-sheet {
  width: 100%; max-width: 420px;
  padding: 0 8px 34px;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.22,1,.36,1);
}
.as-overlay.show .as-sheet { transform: translateY(0); }
.as-group {
  background: rgba(255,255,255,.88); backdrop-filter: blur(20px);

}
.as-group .as-item {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 16px; font-size: 18px; color: #007aff; font-weight: 500;
  border: none; background: none; width: 100%; cursor: pointer;

}
.as-group .as-item + .as-item { border-top: .5px solid rgba(0,0,0,.12); }

.as-cancel { font-weight: 600; }

/* Details — default open */
.details {
  margin-top: 10px; padding-top: 10px;

.details.closed { display: none; }

/* ── Overview day list ── */

/* ── Leaflet overrides ── */
.leaflet-popup-content-wrapper { border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important; }

.dd.open .dd-panel { display: block; }
.dd-item { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none;

.dd-item.on { background: var(--bg-grouped); font-weight: 600; }
.dd-add { color: var(--accent); }

.settings-btn { margin-left: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--bg-elevated);

.settings-btn svg { width: 18px; height: 18px; }
.sheet { position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,.35); display: none; align-items: flex-end; }
.sheet.show { display: flex; }
.sheet-box { width: 100%; background: #fff; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.mode-opts { display: flex; gap: 8px; flex-wrap: wrap; }
.mode-opt { padding: 9px 14px; border-radius: 10px; background: var(--bg-grouped); border: 0; font-size: 14px; }
.mode-opt.on { background: var(--accent); color: #fff; }
</style>

  const uid = `d${dayIdx}-${(loc0.name||'').replace(/\W/g,'')}`;
  const locKey = `${dayIdx}::${(loc0.name||'')}`;
  const gmapQ = loc.gmap||encodeURIComponent(loc.name+' Tokyo');
  const oi = CH[chKey(dayIdx, li)] || 0;
  const hasOpts = loc0.options && loc0.options.length > 1;
  const ddId = `${dayIdx}-${li}`;
  const CARET = '<svg class="dd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
  const dropdown = hasOpts ? `<div class="dd" onclick="event.stopPropagation()">
      <button class="dd-btn" onclick="ddToggle('${ddId}')"><span>${loc.name}</span>${CARET}</button>
      <div class="dd-panel" id="dd-${ddId}">
        ${loc0.options.map((o,k)=>`<button class="dd-item${k===oi?' on':''}" onclick="pickOpt(${dayIdx},${li},${k})">${o.name}</button>`).join('')}
        <button class="dd-item dd-add" onclick="ddAddSearch(${dayIdx},${li})">＋ 搜索添加地点</button>
      </div>
    </div>` : '';
  const ICON_NAV  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3z"/></svg>';
  const ICON_DP   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v7a2.5 2.5 0 0 0 5 0V4"/><path d="M6.5 12v8"/><path d="M18.5 4c-1.8 1.1-2.8 3.3-2.8 5.8V12h2.8z"/><path d="M16.5 12v8"/></svg>';
  const ICON_XHS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5A2.5 2.5 0 0 1 17.5 21H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h8M8 12h8"/></svg>';
  let lnk = `<button class="btn nav" onclick="openAS('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng},'${gmapQ}')">${ICON_NAV}<span>导航</span></button>`;
  if(loc.xhs||loc.xhsKeyword) {
    const xhsHref = IN_APP_WEBVIEW ? xhsWebUrl(loc) : xhsAppUrl(loc);
    lnk += `<a href="${xhsHref}" onclick="return openXhs('${locKey.replace(/'/g,"\\'")}')" class="btn xhs">${ICON_XHS}<span>小红书</span></a>`;
  }
  const dpEnabled = loc.dianping !== false && (loc.dianping || loc.dianpingKeyword || loc.type==='food' || loc.type==='drink');
  if(dpEnabled) {
    const dpHref = IN_APP_WEBVIEW ? dpWebUrl(loc) : dpAppUrl(loc);
    lnk += `<a href="${dpHref}" onclick="return openDp('${locKey.replace(/'/g,"\\'")}')" class="btn dp">${ICON_DP}<span>点评</span></a>`;
  }
  const noteParts = [];
  if (loc.addr) noteParts.push(loc.addr);
  if (loc.detail) noteParts.push(loc.detail);
  if (loc.budget) noteParts.push(loc.budget);
  const note = noteParts.length ? `<div class="row-note">${noteParts.map(t=>'<div>'+t.replace(/\n/g,'<br>')+'</div>').join('')}</div>` : '';
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="cardTap(event,${dayIdx},${li},'${uid}')">
    <div class="row-top">
      <span class="time">${(loc0.time!=='—')?loc0.time:'备选'}</span>
      ${dropdown}
    </div>
    <div class="row-main">
      <div class="col-left">
        <div class="name">${bdg} ${loc0.name}${hasOpts?'<span class="pick-hint">可切换</span>':''}</div>
        ${loc.desc?'<div class="desc">'+loc.desc+'</div>':''}
        ${payChips(loc.pay)}
      </div>
      <div class="links">${lnk}</div>
    </div>
    ${note}
  </div></div>`;
}

let _leg = null;
function openLegSheet(dayIdx, li) {
  _leg = [dayIdx, li];
  const key = dayIdx + ':' + li;
  const curM = legMode[key] || defMode();
  document.getElementById('legSheetTitle').textContent = '这一段怎么走？';
  document.getElementById('legModes').innerHTML = ['drive','taxi','walk'].map(m =>
    `<button class="mode-opt${m===curM?' on':''}" data-m="${m}" onclick="pickLegMode('${m}')">${MODES[m].label}</button>`).join('');
  document.getElementById('legSheet').classList.add('show');
}
function closeLegSheet() { document.getElementById('legSheet').classList.remove('show'); }
function pickLegMode(m) {
  if (!_leg) return;
  legMode[_leg[0] + ':' + _leg[1]] = m;
  closeLegSheet();
  reRenderDay(cur);
}
function cardTap(ev, dayIdx, li, uid) {
  if (ev.target.closest('.btn,.links,.dd')) return;     // 按钮/下拉不触发
  const el = document.getElementById(uid);
  if (el) el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  focusLoc(dayIdx, li);
}
function legInfo(dayIdx, li) {
  const key = dayIdx + ':' + li;
  const d = LEGS[key];
  if (!d) return '';
  let m = legMode[key] || defMode();
  let data = (m === 'walk') ? d.walk : d.drive;
  if (!data || data[0] === null) { data = d.drive; m = 'drive'; }   // 没有该方式数据时退回自驾
  if (!data || data[0] === null) return '';
  const km = data[0], min = data[1];
  if (km === 0) return '';
  const timeTxt = min >= 60 ? `${Math.floor(min/60)} 小时${min%60?(' '+min%60+' 分'):''}` : `${min} 分钟`;
  return `<div class="leg" onclick="event.stopPropagation()">
    <span class="leg-line"></span>
    <button class="leg-pill" onclick="openLegSheet(${dayIdx},${li})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${MODES[m].icon}</svg>
      <span>${MODES[m].label} ${km}km · ${timeTxt}</span>
    </button>
    <span class="leg-line"></span>
  </div>`;
}
function cycleMode(dayIdx, li) {
  const order = ['drive','taxi','walk'];
  const key = dayIdx + ':' + li;
  const cur = legMode[key] || defMode();
  legMode[key] = order[(order.indexOf(cur) + 1) % order.length];
  reRenderDay(dayIdx);
}
function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  if(main.length) { h += '<div class="section-head">行程</div><div class="timeline">'; main.forEach((l,i) => { const li = d.locations.indexOf(l); if (i>0) h += legInfo(idx, li); h += locCard(l, idx, li); }); h += '</div>'; }
  if(alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach((l,i) => { h += locCard(l, idx, d.locations.indexOf(l)); }); h += '</div>'; }
  return h;
}

// ══════════ NAV ══════════
let cur = 0;
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

DAYS.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (d.id===0?' active':'');
  btn.dataset.day = d.id;
  btn.textContent = d.label;
  tabsEl.appendChild(btn);
});

function go(idx) {
  cur = idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day===idx));
  contentEl.innerHTML = idx===0 ? overviewContent() : renderDay(idx);
  showDay(idx);
  contentEl.scrollTo({top:0});
  const tab = tabsEl.querySelector(`[data-day="${idx}"]`);
  if(tab) tab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function toggle(id) { const el=document.getElementById(id); if(el) el.classList.toggle('closed'); }

tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });

go(0);

/* ── Action Sheet for Navigation ── */
const asOverlay = document.createElement('div');
asOverlay.className = 'as-overlay';
asOverlay.innerHTML = `<div class="as-sheet">
  <div class="as-group" id="as-opts"></div>
  <div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div>
</div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function amapAppUrl(name, lat, lng) {
  const scheme = IS_IOS ? 'iosamap' : 'androidamap';
  return `${scheme}://viewMap?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=0`;
}
function amapWebUrl(name, lat, lng) {
  return `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&src=trip&coordinate=gcj02&callnative=1`;
}
function openAmap(name, lat, lng) {
  if (IN_APP_WEBVIEW) { window.open(amapWebUrl(name, lat, lng)); return; }
  window.location.href = amapAppUrl(name, lat, lng);
}

function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name + ' Tokyo');
  const encName = encodeURIComponent(name);
  const safeName = name.replace(/'/g,"\\'");
  // WebView 内 maps:// 通常被拦截，改用 https Apple Maps URL —— iOS 系统会自动拉起 Apple Maps
  const appleUrl = IN_APP_WEBVIEW
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('as-opts').innerHTML =
    `<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button>` +
    `<button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button>` +
    `<button class="as-item" onclick="openAmap('${safeName}',${lat},${lng});closeAS()">🧭 高德地图 App</button>`;
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }
</script>

<div class="sheet" id="legSheet" onclick="if(event.target===this)closeLegSheet()">
  <div class="sheet-box">
    <div class="sheet-title" id="legSheetTitle">这一段怎么走？</div>
    <div class="mode-opts" id="legModes"></div>
  </div>
</div>
</body>
